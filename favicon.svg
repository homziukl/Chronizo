<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Neutral, brand-agnostic chronology mark: a clock above a timeline axis. -->
  <!-- Strokes are kept bold so the motif stays legible when scaled down to a 16px browser-tab favicon. -->

  <!-- Timeline axis with a direction arrow -->
  <line x1="9" y1="52" x2="49" y2="52" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M47 47 L57 52 L47 57 Z" fill="#64748b"/>

  <!-- Bold tick marks along the axis -->
  <line x1="18" y1="48" x2="18" y2="56" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="48" x2="30" y2="56" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="42" y2="56" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Clock dial -->
  <circle cx="29" cy="23" r="18" fill="#f1f5f9" stroke="#334155" stroke-width="4"/>

  <!-- Cardinal hour marks (sized to survive downscaling) -->
  <line x1="29" y1="9"  x2="29" y2="13" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43" y1="23" x2="39" y2="23" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="29" y1="37" x2="29" y2="33" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="23" x2="19" y2="23" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Clock hands -->
  <line x1="29" y1="23" x2="29" y2="13" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="29" y1="23" x2="38" y2="26" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="29" cy="23" r="2.6" fill="#2563eb"/>
</svg>
