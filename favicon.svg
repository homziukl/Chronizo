<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Timeline builder">
  <!-- Neutral, brand-agnostic chronology mark: a timeline axis with connected event nodes. -->
  <!-- No brand references (no TVA/Marvel motif, no "Sacred Timeline"); it simply depicts a -->
  <!-- generic chronology/timeline builder: events as nodes joined by a thread over a time axis. -->
  <!-- Strokes are kept bold so the motif stays legible when scaled down to a 16px browser-tab favicon. -->

  <!-- Timeline axis with a direction arrow -->
  <line x1="8" y1="48" x2="52" y2="48" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 43 L60 48 L50 53 Z" fill="#334155"/>

  <!-- Axis tick marks -->
  <line x1="16" y1="44" x2="16" y2="52" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="44" x2="30" y2="52" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="44" x2="44" y2="52" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Event thread connecting nodes across time (a "builder" linking points on the axis) -->
  <polyline points="16,30 30,16 44,24" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Event nodes -->
  <circle cx="16" cy="30" r="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="3"/>
  <circle cx="30" cy="16" r="5" fill="#f1f5f9" stroke="#2563eb" stroke-width="3"/>
  <circle cx="44" cy="24" r="5" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
</svg>
